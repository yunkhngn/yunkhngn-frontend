<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Contact</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #e5e5e5;
      -webkit-font-smoothing: antialiased;
    "
  >
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px">
      <div
        style="
          margin-bottom: 40px;
          border-bottom: 1px solid #333;
          padding-bottom: 20px;
        "
      >
        <h1
          style="
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
          "
        >
          New Contact Message
        </h1>
        <div style="margin-top: 8px; font-size: 13px; color: #888">
          Received via yunkhngn.dev
        </div>
      </div>

      <div
        style="
          background: #111;
          border: 1px solid #222;
          border-radius: 12px;
          padding: 24px;
        "
      >
        <div
          style="
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 16px;
            margin-bottom: 24px;
          "
        >
          <div
            style="
              font-size: 12px;
              color: #666;
              text-transform: uppercase;
              letter-spacing: 1px;
              padding-top: 4px;
            "
          >
            From
          </div>
          <div>
            <div style="font-size: 16px; font-weight: 500; color: #fff">
              ${data.name}
            </div>
            <div style="font-size: 14px; color: #888; margin-top: 2px">
              ${data.email}
            </div>
          </div>
        </div>

        ${ data.phone ? `
        <div
          style="
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 16px;
            margin-bottom: 24px;
          "
        >
          <div
            style="
              font-size: 12px;
              color: #666;
              text-transform: uppercase;
              letter-spacing: 1px;
              padding-top: 4px;
            "
          >
            Phone
          </div>
          <div style="font-size: 15px; color: #ccc">${data.phone}</div>
        </div>
        ` : '' } ${ data.company ? `
        <div
          style="
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 16px;
            margin-bottom: 24px;
          "
        >
          <div
            style="
              font-size: 12px;
              color: #666;
              text-transform: uppercase;
              letter-spacing: 1px;
              padding-top: 4px;
            "
          >
            Company
          </div>
          <div style="font-size: 15px; color: #ccc">${data.company}</div>
        </div>
        ` : '' }

        <div
          style="
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 16px;
            margin-bottom: 24px;
          "
        >
          <div
            style="
              font-size: 12px;
              color: #666;
              text-transform: uppercase;
              letter-spacing: 1px;
              padding-top: 4px;
            "
          >
            Category
          </div>
          <div>
            <span
              style="
                display: inline-block;
                padding: 4px 10px;
                background: #222;
                border: 1px solid #333;
                border-radius: 4px;
                font-size: 12px;
                color: #ccc;
              "
              >${data.category}</span
            >
          </div>
        </div>

        <div
          style="
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #222;
          "
        >
          <div
            style="
              font-size: 12px;
              color: #666;
              text-transform: uppercase;
              letter-spacing: 1px;
              margin-bottom: 12px;
            "
          >
            Message
          </div>
          <div
            style="
              font-size: 16px;
              line-height: 1.6;
              color: #e5e5e5;
              white-space: pre-wrap;
            "
          >
            ${data.message}
          </div>
        </div>
      </div>

      <div style="margin-top: 32px; text-align: center">
        <a
          href="${data.adminUrl}"
          style="
            display: inline-block;
            padding: 12px 24px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            transition: opacity 0.2s;
          "
          >Reply in Dashboard</a
        >
      </div>
    </div>
  </body>
</html>
