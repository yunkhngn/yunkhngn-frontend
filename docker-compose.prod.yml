services:
  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  redis:
    image: redis:alpine
    container_name: yunkhngn-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: yunkhngn-mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Khoadeptrai1204!
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    networks:
      - app-network
    ports:
      - "1433:1433"
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/yunkhngn/yunkhngn-website-backend:latest}
    # build:
    #   context: ./be
    #   dockerfile: Dockerfile.prod
    container_name: yunkhngn-backend
    restart: always
    env_file:
      - ./be/.env
    environment:
      - REDIS_HOST=redis
      - FRONTEND_URL=https://yunkhngn.dev
      - LETTER_AI_URL=http://letter-ai:8000
      - SELF_URL=http://backend:3001
    ports:
      - "3001:3001"
    networks:
      - app-network
    volumes:
      - ./be/firebase-admin-sdk.json:/app/firebase-admin-sdk.json
    depends_on:
      - mssql
      - letter-ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/yunkhngn/yunkhngn-website-frontend:latest}
    # build:
    #   context: ./fe
    #   dockerfile: Dockerfile.prod
    #   args: ...
    container_name: yunkhngn-frontend
    restart: always
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

  letter-ai:
    image: ${LETTER_AI_IMAGE:-ghcr.io/yunkhngn/yunkhngn-letter-ai:latest}
    container_name: yunkhngn-letter-ai
    restart: always
    env_file:
      - ./letter-ai/.env
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  caddy:
    image: caddy:2-alpine
    container_name: yunkhngn-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  mssql_data:
  caddy_data:
  caddy_config:
