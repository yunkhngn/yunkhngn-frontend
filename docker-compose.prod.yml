version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: yunkhngn-mssql
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Khoadeptrai1204!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - app-network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile.prod
    container_name: yunkhngn-backend
    restart: always
    env_file:
      - ./be/.env
    ports:
      - "3001:3001"
    networks:
      - app-network
    volumes:
      - ./be/firebase-admin-sdk.json:/app/firebase-admin-sdk.json

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: https://yunkhngn.dev/api
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    container_name: yunkhngn-frontend
    restart: always
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: yunkhngn-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  mssql_data:
  caddy_data:
  caddy_config:
