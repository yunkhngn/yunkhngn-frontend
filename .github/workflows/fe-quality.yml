name: Frontend Quality

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'fe/**'
      - '.github/workflows/fe-quality.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'fe/**'
      - '.github/workflows/fe-quality.yml'

jobs:
  fe-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: 'fe/yarn.lock'

      - name: Install Dependencies
        run: |
          cd fe && yarn install --frozen-lockfile

      - name: Lint Frontend
        run: |
          cd fe && yarn lint

      - name: Test Frontend
        run: |
          cd fe
          export JEST_JUNIT_OUTPUT_DIR="reports"
          export JEST_JUNIT_OUTPUT_NAME="fe-test-report.xml"
          yarn test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-test-reports
          path: fe/reports/*.xml
