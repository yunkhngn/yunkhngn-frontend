name: CI/CD

on:
  push:
    branches: [ "main"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Quality Check (Lint & Test)
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package.json declares yarn@4 via packageManager — Corepack must be on before yarn runs
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: |
          cd be && yarn install --immutable && npx prisma generate
          cd ../fe && yarn install --immutable

      - name: Lint Backend & Frontend
        run: |
          cd be && yarn lint
          cd ../fe && yarn lint

      - name: Test Backend
        run: |
          cd be
          export JEST_JUNIT_OUTPUT_DIR="reports"
          export JEST_JUNIT_OUTPUT_NAME="be-test-report.xml"
          yarn test

      - name: Test Frontend
        run: |
          cd fe
          export JEST_JUNIT_OUTPUT_DIR="reports"
          export JEST_JUNIT_OUTPUT_NAME="fe-test-report.xml"
          yarn test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            be/reports/*.xml
            fe/reports/*.xml

  # 2. Security Check (SAST)
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default


  # 3a. Build & Push Backend
  build_backend:
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./be
          file: ./be/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3b. Build & Push Frontend
  build_frontend:
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          file: ./fe/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_API_KEY=${{ secrets.NEXT_PUBLIC_CLOUDINARY_API_KEY }}

  # 3c. Build & Push Letter AI
  build_letter_ai:
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Letter AI
        uses: docker/build-push-action@v5
        with:
          context: ./letter-ai
          file: ./letter-ai/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-letter-ai:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Deploy to Production
  deploy_production:
    needs: [build_backend, build_frontend, build_letter_ai]
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: IMAGE_TAG
          script: |
            echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /apps/yunkhngn-website
            git pull origin main
            
            export BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${IMAGE_TAG}"
            export LETTER_AI_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-letter-ai:${IMAGE_TAG}"
            
            docker compose -f docker-compose.prod.yml up -d

      - name: Health Check (Production)
        run: |
          HEALTH_URL="https://yunkhngn.dev/api/health"
          echo "Health check URL: ${HEALTH_URL}"
          echo "Waiting for services to start..."
          sleep 15
          for i in {1..6}; do
            echo "--- Attempt $i ---"
            HTTP_CODE=$(curl -k -s -o /tmp/health_body.txt -w "%{http_code}" "${HEALTH_URL}" 2>&1) || true
            echo "HTTP Status: ${HTTP_CODE}"
            echo "Response body: $(cat /tmp/health_body.txt 2>/dev/null)"
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting 10 seconds before retrying..."
            sleep 10
          done
          echo "Health check failed after 6 attempts."
          exit 1

  # 6. Rollback (On Failure)
  rollback:
    needs: deploy_production
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get Previous Commit SHA
        id: prev_sha
        run: echo "sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT

      - name: Rollback Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          PREV_TAG: sha-${{ steps.prev_sha.outputs.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          envs: PREV_TAG
          script: |
            echo "Rolling back to ${PREV_TAG}..."
            cd ~/apps/yunkhngn-website
            
            export BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${PREV_TAG}"
            export FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${PREV_TAG}"
            export LETTER_AI_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-letter-ai:${PREV_TAG}"
            
            docker compose -f docker-compose.prod.yml up -d
