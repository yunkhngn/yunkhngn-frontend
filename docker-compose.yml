version: '3.8'

services:
  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: yunkhngn_mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "1434:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - app_network
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  ollama:
    image: ollama/ollama:latest
    container_name: yunkhngn_ollama_dev
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_network
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 3G
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: yunkhngn_backend
    depends_on:
      - mssql
    env_file:
      - ./be/.env
    environment:
      - DATABASE_URL=sqlserver://mssql:1433;database=blogdb;user=sa;password=YourStrong@Passw0rd;encrypt=false;trustServerCertificate=true
      - PORT=3001
    ports:
      - "3001:3001"
    networks:
      - app_network
    volumes:
      - ./be:/usr/src/app
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile.dev
    container_name: yunkhngn_frontend
    environment:
      - API_URL=http://backend:3001
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - WATCHPACK_POLLING=true # Often needed for hot reload on some systems
    env_file:
      - ./fe/.env
    ports:
      - "3000:3000"
    volumes:
      - ./fe:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    networks:
      - app_network
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  caddy:
    image: caddy:2-alpine
    container_name: yunkhngn_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

networks:
  app_network:
    driver: bridge

volumes:
  mssql_data:
  ollama_data:
  caddy_data:
  caddy_config:
